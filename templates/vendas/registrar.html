{% extends 'home/base.html' %} {% load static %} {% block title %}Criar Conta -
Pizzaria Bomkisó{% endblock %} {% block content %}
<div
  class="row justify-content-center align-items-center"
  style="min-height: 85vh"
>
  <div class="col-md-6 col-lg-5">
    <div class="text-center mb-4">
      <h2 class="fw-bold text-dark">
        <span class="text-danger">BOM</span>KISÓ
      </h2>
      <p class="text-muted">Faça seu cadastro e comece a pedir!</p>
    </div>

    <div class="card shadow-lg border-0 rounded-4">
      <div
        class="card-header bg-dark text-white text-center py-3 rounded-top-4 border-0"
      >
        <h4 class="mb-0 fw-bold">Cadastro de Novo Cliente</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {% csrf_token %}

          <div class="row">
            <div class="col-12 mb-3">
              <label for="username" class="form-label fw-semibold"
                >Usuário (Login)</label
              >
              <input
                type="text"
                name="username"
                id="username"
                class="form-control bg-light"
                placeholder="Ex: joao_pizzas"
                required
              />
            </div>

            <div class="col-12 mb-3">
              <label for="password" class="form-label fw-semibold">Senha</label>
              <input
                type="password"
                name="password"
                id="password"
                class="form-control bg-light"
                placeholder="******"
                required
              />
            </div>

            <hr class="my-4 text-muted" />
            <h6 class="mb-3 fw-bold text-danger">Dados de Contato e Entrega</h6>

            <div class="col-12 mb-3">
              <label for="telefone" class="form-label fw-semibold"
                >WhatsApp / Telefone</label
              >
              <input
                type="text"
                name="telefone"
                id="telefone"
                class="form-control bg-light"
                placeholder="(00) 00000-0000"
                required
              />
            </div>

            <div class="col-12 mb-4">
              <label for="endereco" class="form-label fw-semibold"
                >Endereço Completo</label
              >
              <textarea
                name="endereco"
                id="endereco"
                rows="2"
                class="form-control bg-light"
                placeholder="Rua, Número, Bairro e Referência"
                required
              ></textarea>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              class="btn btn-danger btn-lg fw-bold shadow-sm"
            >
              Finalizar Cadastro
            </button>
          </div>
        </form>
      </div>
      <div
        class="card-footer text-center bg-white border-0 py-3 rounded-bottom-4"
      >
        <p class="mb-0 text-muted small">
          Já tem uma conta?
          <a
            href="{% url 'login' %}"
            class="text-danger fw-bold text-decoration-none"
            >Faça login aqui</a
          >
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
