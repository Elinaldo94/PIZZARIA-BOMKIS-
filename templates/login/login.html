{% extends 'home/base.html' %} {% load static %} {% block title %}Login -
Pizzaria Bomkisó{% endblock %} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="text-center mb-4">
      <h2 class="fw-bold"><span class="text-danger">BOM</span>KISÓ</h2>
      <p class="text-muted">Gerenciamento Integrado de Pizzarias</p>
    </div>

    <div class="card shadow-lg">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Acessar Sistema</h4>
      </div>

      <div class="card-body">
        <form method="POST" id="login-form">
          {% csrf_token %}

          <div class="mb-4">
            <label for="username" class="form-label">Usuário</label>
            <input
              type="text"
              name="username"
              id="username"
              class="form-control"
              placeholder="Seu usuário"
              required
            />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Senha</label>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              placeholder="Sua senha secreta"
              required
            />
          </div>

          <button type="submit" class="btn btn-danger">Entrar no Painel</button>
        </form>
      </div>

      <div class="card-footer">
        <p class="mb-0 text-muted">
          Não tem uma conta?
          <a
            href="{% url 'registrar' %}"
            class="text-danger fw-bold text-decoration-none"
            >Crie uma agora</a
          >
        </p>
      </div>
    </div>

    <div class="text-center mt-4"></div>
  </div>
</div>
{% endblock %}
